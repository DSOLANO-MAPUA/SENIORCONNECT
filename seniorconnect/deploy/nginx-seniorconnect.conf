# nginx site for SeniorConnect: PHP pages + Flask API on ONE domain.
# Install:  sudo cp deploy/nginx-seniorconnect.conf /etc/nginx/sites-available/seniorconnect
#           sudo ln -s /etc/nginx/sites-available/seniorconnect /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then edit server_name below, and run:  sudo certbot --nginx -d YOUR_DOMAIN

server {
    listen 80;
    server_name YOUR_DOMAIN;            # <-- change (or use _ for an IP-only test)

    root /var/www/seniorconnect;
    index index.php;

    client_max_body_size 1m;

    # ---- Flask API (never exposed directly; nginx forwards /api to gunicorn) ----
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- never serve secrets, source, SQL or docs ----
    location ~ /\.                                   { deny all; }   # .env, .git, ...
    location ~ ^/(database|deploy|venv)/             { deny all; }
    location ~* \.(py|pyc|sql|md|txt|service|example|conf)$ { deny all; }
    location = /auth.php                             { deny all; }   # include-only helper

    # ---- PHP pages ----
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;   # if missing, use e.g. /run/php/php8.3-fpm.sock
    }

    # ---- static files ----
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
